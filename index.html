<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PyScript -->
    <link rel="stylesheet"
        href="https://pyscript.net/releases/2024.3.1/core.css">

    <script type="module"
        src="https://pyscript.net/releases/2024.3.1/core.js">
    </script>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Poppins Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <title>2nd Quarter | Drill 2</title>

</head>

<body>

    <div class="container">

        <div class="main-card">

            <!-- Science Club Logo -->
            <div class="logo-container">
                <img
                    src="SCICLUBPHOTO.png"
                    alt="Science Club Logo"
                    class="club-logo">
            </div>

            <!-- Page heading -->
            <h1 class="title text-center">
                🔬 SCIENCE CLUB ദ്ദി(˵ •̀ ᴗ - ˵ ) ✧
            </h1>

            <p class="subtitle text-center mb-4">
                Student Club Member Management System
            </p>

            <hr>

            <!-- Member input section -->
            <div class="input-section">

                <h4 class="mb-4">
                    Add New Club Member ･ ༝ ･
                </h4>

                <!-- First name -->
                <label for="first_name" class="form-label">
                    First Name ⋆. 𐙚 ˚
                </label>

                <input
                    type="text"
                    id="first_name"
                    class="form-control mb-3"
                    placeholder="Enter first name">

                <!-- Last name -->
                <label for="last_name" class="form-label">
                    Last Name ⋆. 𐙚 ˚
                </label>

                <input
                    type="text"
                    id="last_name"
                    class="form-control mb-3"
                    placeholder="Enter last name">

                

                <!-- Add member button -->
                <button
                    type="button"
                    py-click="result_checker"
                    class="btn btn-success w-100">

                    ➕ Add Member

                </button>

            </div>

            <hr class="my-4">

            <!-- Results -->
            <div id="output" class="p-4">

                <p class="text-muted text-center">
                    Loading Science Club members...
                </p>

            </div>

        </div>

    </div>

    <!-- External Python file -->
    <script type="py" src="./main.py"></script>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
